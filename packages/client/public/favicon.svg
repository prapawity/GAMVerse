<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="space" cx="28%" cy="18%" r="100%">
      <stop offset="0" stop-color="#29204d" />
      <stop offset=".56" stop-color="#19142f" />
      <stop offset="1" stop-color="#0b091a" />
    </radialGradient>
    <radialGradient id="planet" cx="31%" cy="27%" r="78%">
      <stop offset="0" stop-color="#a6e4f3" />
      <stop offset=".22" stop-color="#759be3" />
      <stop offset=".58" stop-color="#59469d" />
      <stop offset=".84" stop-color="#382660" />
      <stop offset="1" stop-color="#18132f" />
    </radialGradient>
    <radialGradient id="cyanMist">
      <stop stop-color="#71def0" stop-opacity=".78" />
      <stop offset=".46" stop-color="#4b9ddc" stop-opacity=".33" />
      <stop offset="1" stop-color="#4b9ddc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetMist">
      <stop stop-color="#c18aff" stop-opacity=".84" />
      <stop offset=".48" stop-color="#9361e2" stop-opacity=".34" />
      <stop offset="1" stop-color="#9361e2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="roseMist">
      <stop stop-color="#ffaddf" stop-opacity=".72" />
      <stop offset=".5" stop-color="#d16fcb" stop-opacity=".26" />
      <stop offset="1" stop-color="#d16fcb" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="letter" x1=".18" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".56" stop-color="#f5efff" />
      <stop offset="1" stop-color="#d9c5ff" />
    </linearGradient>
    <filter id="cloud" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.5" />
    </filter>
    <filter id="planetGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="letterShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#080511" flood-opacity=".85" />
    </filter>
    <clipPath id="rounded"><rect width="64" height="64" rx="18" /></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="64" height="64" fill="url(#space)" />
    <!-- Nebula haze and the planet sit behind the foreground G. -->
    <ellipse cx="13" cy="38" rx="25" ry="17" fill="url(#cyanMist)" filter="url(#cloud)" />
    <ellipse cx="37" cy="20" rx="23" ry="18" fill="url(#violetMist)" filter="url(#cloud)" />
    <ellipse cx="51" cy="43" rx="21" ry="19" fill="url(#roseMist)" filter="url(#cloud)" />
    <circle cx="35" cy="31" r="18" fill="#8872df" opacity=".64" filter="url(#planetGlow)" />
    <circle cx="35" cy="31" r="15.5" fill="url(#planet)" />
    <path d="M22.8 24.2c3.2-5.5 9.2-8.7 15.4-8.2-5.5 1.3-8.9 4.5-11.7 9.3-2.8 4.8-3.2 10.1-1.7 14.4-4.8-4.1-5.3-10.1-2-15.5Z" fill="#d4f3ff" opacity=".27" />
    <path d="M25 42c5.1 5.2 13.4 6.3 19.6 2.3" fill="none" stroke="#bd9cff" stroke-opacity=".4" stroke-width="1.1" stroke-linecap="round" />
    <path d="M-1 48c10-8 17-5 25-14 7-8 15-18 41-18" fill="none" stroke="#a98aff" stroke-opacity=".3" stroke-width="8" stroke-linecap="round" filter="url(#cloud)" />
    <path d="M-1 48c10-8 17-5 25-14 7-8 15-18 41-18" fill="none" stroke="#d6bdff" stroke-opacity=".34" stroke-width="1" stroke-linecap="round" />
    <!-- Clear, foreground G mark. -->
    <path d="M42.5 22.8A13.1 13.1 0 1 0 45 32H32.5" fill="none" stroke="#130d25" stroke-opacity=".8" stroke-linecap="round" stroke-linejoin="round" stroke-width="9.5" />
    <path d="M42.5 22.8A13.1 13.1 0 1 0 45 32H32.5" fill="none" stroke="url(#letter)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" filter="url(#letterShadow)" />
    <circle cx="11" cy="17" r=".85" fill="#e8e0ff" />
    <circle cx="53" cy="13" r=".7" fill="#a4edff" />
    <circle cx="53" cy="49" r="1" fill="#f6b4e4" />
    <circle cx="14" cy="51" r=".65" fill="#a5e7f4" />
  </g>
</svg>
